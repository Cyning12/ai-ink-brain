# Harness V2 · Verify：PR/push 上 lint + test + build（与 docs/harness/HARNESS_V2_PLAN.md §4 P0/P1 对齐）
name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - production

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 模式 A：复用后端同源导出脚本（路径相对 GITHUB_WORKSPACE）；--input/--output 须为绝对路径（脚本内 REPO_ROOT 为 api-python 仓根）
      - name: Checkout backend (tech graph graph export)
        uses: actions/checkout@v5
        with:
          repository: Cyning12/ai-ink-brain-api-python
          path: ai-ink-brain-api-python

      # 版本以 package.json 的 packageManager（pnpm@x.y.z）为唯一真源，勿在此再写 version，否则与 action-setup 冲突报 ERR_PNPM_BAD_PM_VERSION
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # scheme_1 graph.json：cwd=本仓根；与 `tech_graph_contract_check` 独立（契约真值在后端仓）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps for tech graph
        run: pip install pyyaml

      - name: Tech graph graph.json (--check)
        run: python3 ai-ink-brain-api-python/tools/tech_graph_graph_export.py --input "${GITHUB_WORKSPACE}/docs/_tech_graph" --output "${GITHUB_WORKSPACE}/docs/_tech_graph/graph.json" --check

      - name: Tech graph graph_v2 equivalence check
        run: python3 ai-ink-brain-api-python/tools/tech_graph_graph_equivalence_check.py --input "${GITHUB_WORKSPACE}/docs/_tech_graph" --graph "${GITHUB_WORKSPACE}/docs/_tech_graph/graph.json"

      - name: Tech graph manifest check
        run: python3 ai-ink-brain-api-python/tools/tech_graph_manifest_check.py --repo frontend --repo-root "${GITHUB_WORKSPACE}" --manifest "${GITHUB_WORKSPACE}/docs/_tech_graph/_manifest.json"

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
