# Harness V2 · Verify：PR/push 上 lint + test + build（与 docs/harness/HARNESS_V2_PLAN.md §4 P0/P1 对齐）
name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - production

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 版本以 package.json 的 packageManager（pnpm@x.y.z）为唯一真源，勿在此再写 version，否则与 action-setup 冲突报 ERR_PNPM_BAD_PM_VERSION
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # scheme_1 graph.json：与 docs/_tech_graph/*.ai.md 一致（--check 忽略 generated_at）；见 content/tasks/active/task_engineering_tech_graph_graph_json_export_v1.md
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tech graph graph.json (--check)
        run: python3 tools/export_graph_json.py --input docs/_tech_graph --output docs/_tech_graph/graph.json --check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
